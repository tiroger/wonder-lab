# Pull requests: build and check the app, play every activity end to end, and show the Terraform plan.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
      - name: Build
        run: python3 build.py
      - name: Script parses
        run: sed -n '/<script>/,/<\/script>/p' dist/artifact.html | sed '1d;$d' > /tmp/app.js && node --check /tmp/app.js
      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive infra
          (cd infra && terraform init -backend=false -input=false && terraform validate)
          (cd infra/bootstrap && terraform init -backend=false -input=false && terraform validate)

  walkthrough:
    name: Play every activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Build and serve
        run: |
          python3 build.py
          (cd dist && python3 -m http.server 8799 >/dev/null 2>&1 &)
          sleep 1
      - name: Walkthrough
        run: node tests/walkthrough.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: walkthrough-screenshot
          path: tests/last-run.png
          if-no-files-found: ignore

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # the plan role trusts pull requests from this repo only (forks don't get OIDC tokens for it)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color -lock=false | tee plan.txt   # read-only: never blocks a deploy
          { echo '### Terraform plan'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
