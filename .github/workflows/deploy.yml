# Push to main: apply the site infrastructure, then build the app and publish it.
# AWS access comes from the OIDC deploy role created by infra/bootstrap. That role only trusts the
# `production` environment, so nothing else in the repo can assume it. No stored AWS keys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wonderlab.camp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform apply (S3, CloudFront, certificate, DNS)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -lock-timeout=10m
          echo "BUCKET=$(terraform output -raw bucket)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"

      - name: Build
        run: python3 build.py

      # The page must always be fresh; voice files have a content hash in their names, so they can be cached for a year.
      # Old voice files are kept (no --delete) so a page opened before this deploy can still load the pack it names.
      - name: Upload to S3
        run: |
          aws s3 sync dist/voice "s3://$BUCKET/voice" --content-type audio/mpeg --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type "text/html; charset=utf-8" --cache-control no-cache

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/" "/index.html" --query Invalidation.Id --output text
